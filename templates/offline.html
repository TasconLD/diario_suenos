{% extends 'base.html' %}

{% block title %}Sin Conexión - Entrenador Onírico{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-3xl p-8 border border-slate-200 dark:border-slate-700 shadow-2xl text-center">
        <div class="w-20 h-20 bg-indigo-500/10 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
            <i class="fa-solid fa-wifi-slash"></i>
        </div>
        
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Modo Offline</h1>
        <p class="text-slate-600 dark:text-slate-400 text-sm mb-6 leading-relaxed">
            Parece que te has quedado sin conexión a Internet. Puedes seguir navegando por las secciones precacheadas de la aplicación.
        </p>

        <button onclick="window.location.reload()" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/30 transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i>
            <span>Reintentar Conexión</span>
        </button>
    </div>
</div>
{% endblock %}

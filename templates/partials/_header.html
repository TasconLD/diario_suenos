<!-- BLOQUE: Header principal con saludo, botón instalar app y acciones -->
<header class="flex flex-col md:flex-row justify-between items-center mb-6 md:mb-10 gap-4 border-b border-slate-200 dark:border-slate-800 pb-4 md:pb-6 pr-12 md:pr-0">
    <div class="text-center md:text-left">
        <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 dark:from-blue-400 dark:via-indigo-400 dark:to-purple-500 bg-clip-text text-transparent tracking-tight">
            <i class="fa-solid fa-moon mr-2 text-indigo-500 dark:text-indigo-400 animate-pulse"></i>Entrenador Onírico
        </h1>
        <p class="text-slate-500 dark:text-slate-400 mt-1 text-xs md:text-sm">Explora los misterios de tu mente subconsciente</p>
    </div>
    
    <div class="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
        <!-- PANEL DE USUARIO LOGUEADO -->
        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-xs md:text-sm">
            <span class="text-slate-500 dark:text-slate-400">Hola, <strong class="text-slate-800 dark:text-slate-200 font-semibold">{{ usuario_nombre }}</strong></span>
            <a href="{{ url_for('auth.logout') }}" class="bg-red-50 hover:bg-red-100 dark:bg-red-500/10 dark:hover:bg-red-500/20 text-red-500 px-2 py-1 rounded-lg transition-all font-bold flex items-center gap-1">
                <i class="fa-solid fa-arrow-right-from-bracket text-[10px]"></i> Salir
            </a>
        </div>

        <!-- BOTÓN SEÑALES ONÍRICAS -->
        <a href="{{ url_for('main.senales') }}" 
           class="bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs md:text-sm px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-1.5 shadow-md">
            <i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i> Mis Señales
        </a>

        <!-- BOTÓN OBJETIVOS LÚCIDOS -->
        <a href="{{ url_for('main.objetivos') }}" 
           class="bg-amber-500 hover:bg-amber-400 text-white font-semibold text-xs md:text-sm px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-1.5 shadow-md">
            <i class="fa-solid fa-bullseye text-[11px]"></i> Objetivos
        </a>

        <!-- BOTÓN INSTALAR APP -->
        <button id="btn-instalar" class="hidden bg-emerald-600 hover:bg-emerald-500 dark:bg-emerald-500 dark:hover:bg-emerald-400 text-white dark:text-slate-900 font-bold text-xs md:text-sm px-3.5 py-2 rounded-xl transition duration-150 flex items-center gap-1.5 shadow-md cursor-pointer">
            <i class="fa-solid fa-download"></i> Instalar App
        </button>

        <button onclick="document.getElementById('modal-registro').classList.remove('hidden')" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs md:text-sm px-4 py-2 rounded-xl transition duration-150 flex items-center gap-1.5 shadow-md cursor-pointer">
            <i class="fa-solid fa-plus text-[10px]"></i> Registrar Sueño
        </button>
        
        <a href="{{ url_for('main.exportar') }}" 
                class="bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs md:text-sm px-4 py-2 rounded-xl transition duration-150 flex items-center gap-1.5 border border-slate-300 dark:border-slate-700 shadow-sm">
            <i class="fa-solid fa-file-pdf text-red-500"></i> Exportar PDF
        </a>
    </div>
</header>

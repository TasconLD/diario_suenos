{% extends "base.html" %}

{% block title %}Iniciar Sesión - Entrenador Onírico{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 md:p-8 shadow-xl">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">
                <i class="fa-solid fa-moon mr-2 text-indigo-500"></i>Iniciar Sesión
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Ingresa a tu diario de sueños personal</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-500 rounded-xl text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold uppercase text-slate-400 text-[10px] mb-1">Usuario</label>
                <input type="text" name="usuario" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block font-bold uppercase text-slate-400 text-[10px] mb-1">Contraseña</label>
                <input type="password" name="contrasena" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-md cursor-pointer">
                Entrar
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500 dark:text-slate-400">
            ¿No tienes cuenta? 
            <a href="{{ url_for('registro') }}" class="text-indigo-500 font-semibold hover:underline">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}

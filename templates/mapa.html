{% extends 'base.html' %}

{% block title %}Mapa Onírico - Red de Conexiones{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Encabezado -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-black text-slate-800 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-network-wired text-indigo-500"></i> Mapa de Conexiones Oníricas
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Explora las interconexiones de tus sueños a través de emociones y señales.
            </p>
        </div>
        
        <!-- Leyenda -->
        <div class="flex items-center gap-3 text-xs font-semibold bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span> Sueños</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Emociones</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Señales (#)</span>
        </div>
    </div>

    <!-- Contenedor del Grafo Interactivo -->
    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 rounded-2xl p-2 shadow-xl relative overflow-hidden h-[600px]">
        <div id="red-onirica" class="w-full h-full"></div>
    </div>
</div>

<!-- Librería Vis.js Network -->
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById('red-onirica');

    fetch("{{ url_for('main.mapa_onirico') }}")
        .then(res => res.json())
        .then(data => {
            const isDark = document.documentElement.classList.contains('dark');
            
            // Recortar texto para el label y dejar el completo para el tooltip (title)
            const nodesFormateados = data.nodes.map(node => {
                const labelOriginal = node.label || '';
                const esTextoLargo = labelOriginal.length > 20;
                
                return {
                    ...node,
                    label: esTextoLargo ? labelOriginal.substring(0, 18) + '...' : labelOriginal,
                    title: labelOriginal // Tooltip nativo al pasar el cursor
                };
            });

            const options = {
                nodes: {
                    borderWidth: 2,
                    shadow: true,
                    font: {
                        color: isDark ? '#e2e8f0' : '#334155',
                        size: 11,
                        face: 'Inter, system-ui',
                        background: isDark ? 'rgba(15, 23, 42, 0.75)' : 'rgba(255, 255, 255, 0.85)',
                        strokeWidth: 0
                    }
                },
                groups: {
                    sueno: {
                        color: { background: '#6366f1', border: '#4338ca' },
                        shape: 'dot',
                        size: 16
                    },
                    emocion: {
                        color: { background: '#f59e0b', border: '#d97706' },
                        shape: 'diamond',
                        size: 14
                    },
                    tag: {
                        color: { background: '#10b981', border: '#047857' },
                        shape: 'ellipse',
                        size: 10
                    }
                },
                edges: {
                    color: { 
                        color: isDark ? '#334155' : '#e2e8f0', 
                        highlight: '#6366f1',
                        hover: '#818cf8'
                    },
                    width: 1.5,
                    smooth: { type: 'continuous' }
                },
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -120,
                        centralGravity: 0.01,
                        springLength: 140,
                        springConstant: 0.08,
                        damping: 0.4
                    },
                    maxVelocity: 50,
                    minVelocity: 0.1,
                    stabilization: {
                        iterations: 150
                    }
                },
                interaction: { 
                    hover: true, 
                    tooltipDelay: 100,
                    zoomView: true 
                }
            };

            const networkData = {
                nodes: new vis.DataSet(nodesFormateados),
                edges: new vis.DataSet(data.edges)
            };

            new vis.Network(container, networkData, options);
        })
        .catch(err => console.error("Error al cargar la red onírica:", err));
});
</script>
{% endblock %}

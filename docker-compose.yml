version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: diario_suenos_db
    restart: always
    environment:
      POSTGRES_USER: usuario_diario
      POSTGRES_PASSWORD: clave_secreta_123
      POSTGRES_DB: diario_suenos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: